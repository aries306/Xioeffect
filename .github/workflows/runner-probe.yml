name: Runner provisioning probe

on:
  push:
    branches:
      - fix/exelta-ui-brand-and-arrival-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner allocation
        run: |
          echo "GitHub-hosted runner allocated successfully"
          uname -a
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
