name: Deploy Exelta Staging

on:
  push:
    branches:
      - fix/staging-pipeline-recovery
  workflow_dispatch:

concurrency:
  group: exelta-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/fix/staging-pipeline-recovery' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-staging]'))
    runs-on: ubuntu-24.04-arm
    environment: staging
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      APP_ENV: staging
      CLOUDFLARE_ENV: staging
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_YmVsb3ZlZC1pbXBhbGEtNjgzMS5jbGVyay5hY2NvdW50cy5kZXYk
      STAGING_BASE_URL: https://exelta-staging.rieza902.workers.dev
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_CLERK_TEST_COOKIE: ${{ secrets.STAGING_CLERK_TEST_COOKIE }}
      STAGING_CLERK_OTHER_TEST_COOKIE: ${{ secrets.STAGING_CLERK_OTHER_TEST_COOKIE }}
      CI_REQUIRE_LIVE_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run validate:staging
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - name: Build for the isolated staging environment
        run: npm run build
      - name: Verify generated Worker targets isolated staging resources
        run: npm run validate:staging-build

      - name: Skip staging deployment if secrets are missing
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLERK_SECRET_KEY == '' }}
        run: |
          echo "Skipping staging deployment: CLOUDFLARE_API_TOKEN and CLERK_SECRET_KEY must be set in the 'staging' environment."

      - name: Verify required deployment credentials
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLERK_SECRET_KEY != '' }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing staging environment secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLERK_SECRET_KEY" || { echo "Missing staging environment secret: CLERK_SECRET_KEY"; exit 1; }

      - name: Deploy isolated staging Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLERK_SECRET_KEY != '' }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Install Clerk staging secret
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLERK_SECRET_KEY != '' }}
        shell: bash
        run: printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --config dist/server/wrangler.json

      - name: Verify live authenticated staging flows
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLERK_SECRET_KEY != '' }}
        run: npm run test:acceptance
